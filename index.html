<title>JeFIT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JeFIT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Charte JeRIDE : nuit bleu marine, dégradé jaune → orange, chiffres gras. iPad = barre du haut avec onglets ; iPhone = onglets en bas */
:root{
 --bg:#0E1320; --bar:#111727; --card:#161D2D; --soft:#1E2638; --soft2:#232C40; --line:#283247; --fg:#F2F4F8; --mut:#8E99AF;
 --acc:#FF7A1A; --acc2:#FFC21A; --acc-ink:#1A1206; --acc-soft:#3A2414; --grad:linear-gradient(90deg,#FFC21A,#FF7A1A); --gradv:linear-gradient(180deg,#FFC21A,#FF6A1A);
 --vio:#9B6BFF; --ok:#2FD07A; --ok-bg:#163A2A; --ok-ink:#D3F8E4; --warm:#FFC21A; --mus:#FF7A1A; --mus2:#FFC21A; --gold:#FFC21A; --danger:#FF5A4E; --low:#4EA1FF;
 --fig:#8E99AF; --fig2:#465169; --hl:#FFFFFF; --eq:#D6DCE6; --eq2:#7E8AA2; --plate:#D6DCE6;
 --f-disp:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
 --f-body:"Nunito","Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
 --r:18px; color-scheme:dark;
}
:root[data-theme="light"]{
 --bg:#F1F3F7; --bar:#FFFFFF; --card:#FFFFFF; --soft:#EEF1F6; --soft2:#E6EAF1; --line:#DCE1EA; --fg:#141A28; --mut:#5F6B82;
 --acc:#F26A0C; --acc-soft:#FFE8D6; --ok:#1FA862; --ok-bg:#D6F5E4; --ok-ink:#0C3A22; --mus:#FF6A1A; --mus2:#FFB21A;
 --fig:#7C879C; --fig2:#BCC4D2; --eq:#1E2638; --eq2:#5F6B82; --plate:#1E2638; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:600 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Coquille ---------- */
#nav{position:fixed;z-index:20;background:var(--bar);border-color:var(--line)}
#main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px;max-width:1240px;margin:0 auto}
.nav-in{display:flex}
.navb{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:11px;font-weight:700;flex:1;padding:8px 0 6px}
.navb svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navb.on{color:var(--acc)}
.navb .live{font-variant-numeric:tabular-nums;color:var(--acc)}
.brand,.nav-r{display:none}
.mtop{display:flex;align-items:center;gap:10px;margin:0 0 16px}
@media (max-width:819px){
 #nav{left:0;right:0;bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
}
@media (min-width:820px){
 #nav{top:0;left:0;right:0;height:calc(76px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:22px}
 .brand{display:flex;align-items:center;flex:none}
 .nav-in{background:var(--soft);border-radius:16px;padding:5px;gap:4px}
 .navb{flex-direction:row;gap:8px;font:700 16px var(--f-disp);padding:10px 16px;border-radius:12px;flex:none;color:var(--mut)}
 .navb svg{width:19px;height:19px}
 .navb.on{background:var(--grad);color:var(--acc-ink)}
 .navb.on .live{color:var(--acc-ink)}
 .nav-r{display:flex;align-items:center;gap:10px;margin-left:auto}
 #main{margin-top:calc(76px + env(safe-area-inset-top,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:22px 120px}
 .mob-only{display:none!important}
}
@media (min-width:820px) and (max-width:1279px){.navb span:not(.live){display:none}.navb.on span{display:inline}}
@media (min-width:820px) and (max-width:1120px){.nav-r .sync{display:none}}
.npill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:var(--soft);font:700 15px var(--f-disp);color:var(--fg);white-space:nowrap}
.npill.clock{font:800 22px var(--f-disp);font-variant-numeric:tabular-nums;padding:0 18px;height:48px;background:var(--card);border:1px solid var(--line)}
.wm{height:clamp(30px,8.5vw,40px);width:auto;display:block}
.wm.lg{height:clamp(36px,3.6vw,48px)}
.logo{width:40px;height:40px;flex:none}

/* ---------- Typo & blocs ---------- */
h1{font:italic 900 clamp(20px,5vw,28px)/1.1 var(--f-disp);letter-spacing:-.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h2{font:700 18px/1.2 var(--f-disp);letter-spacing:0;margin:0;text-wrap:balance}
h3{font:700 16px/1.3 var(--f-body);margin:0}
.eyebrow{font:700 12px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top .acts{display:flex;gap:8px;align-items:center;margin-left:auto}
a.btn{text-decoration:none}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{margin-top:28px}
.sec>.hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--soft)}
.btn{border-radius:14px}.btn.pri{background:var(--grad);color:var(--acc-ink);font-weight:800}
.btn.ok{background:var(--ok);color:#fff}
.btn.dng{color:var(--danger)}
.btn.blk{width:100%}

.sp-tag{font:800 12px var(--f-disp);letter-spacing:.9em;text-transform:uppercase;color:#FFD98A;opacity:0;margin-right:-.32em}
#splash.go .sp-tag{animation:spTag 1s 1.15s cubic-bezier(.2,.8,.2,1) forwards}
.sp-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.3)}
@keyframes spX{to{transform:scaleX(1)}}
@keyframes spUp{to{transform:none}}
@keyframes spDb{to{opacity:1;transform:none}}
@keyframes spU{to{width:min(42vw,230px)}}
@keyframes spTag{to{opacity:1;letter-spacing:.32em}}
@keyframes spGlow{to{filter:drop-shadow(0 0 16px rgba(255,150,30,.5))}}
@keyframes spHalo{to{opacity:1;transform:scale(1)}}
#auth .ac{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1)}
#auth.in .ac{opacity:1;transform:none}

/* ---------- Écran de compte ---------- */
#auth{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#auth .ac{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
#auth .ac .wm{height:52px;margin:0 auto}
#auth h2{text-align:center;font-size:22px}
#auth .lead{text-align:center;margin:-8px 0 0;color:var(--mut);font-size:14px}
#auth .err{color:var(--danger);font-size:14px;min-height:20px;text-align:center}
#auth .lnk{color:var(--acc);font-weight:700;font-size:14px;text-align:center;width:100%;padding:6px}
#auth .note{font-size:12px;color:var(--mut);text-align:center;margin:0}

/* ---------- Paramètres ---------- */
.ver{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,var(--card),var(--soft));padding:20px}
.vnum{font:italic 900 40px/1 var(--f-disp);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.vdate{text-align:right;font-size:13px;color:var(--mut)}
.vdate b{color:var(--fg);font-size:16px;font-variant-numeric:tabular-nums}
.acc-row{display:flex;align-items:center;gap:14px;padding-bottom:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--grad);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font:900 22px var(--f-disp);flex:none}
.set-card .mi:first-child{border-top:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 140px}
details.sql{border-top:1px solid var(--line);padding-top:12px}
details.sql summary{cursor:pointer;font-weight:700;color:var(--acc)}
details.sql pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:12px;padding:12px;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--fg);margin:10px 0}
details.sql ol{padding-left:20px;margin:8px 0;font-size:14px;color:var(--mut)}
@media (max-width:819px){.navb{min-width:0}.navb span{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}

 const k2=P.k2||[P.k1[0]-2.5,P.k1[1]], f2=P.f2||[P.f1[0]-2.5,P.f1[1]];

 const arm=(s,e,w,far)=>{const c=far?'bf':'b';return cap(s,e,3.9,3.1,c)+(M.has('bras')?mus(mid(s,e,.12),mid(e,s,.1),3.0,2.4,far):'')+cap(e,w,3.0,2.4,c)+`<circle class="${c}" cx="${w[0]}" cy="${w[1]}" r="2.8"/>`};
 const leg=(p,k,ft,far)=>{const c=far?'bf':'b';return cap(p,k,5.5,3.9,c)+(M.has('jambes')?mus(mid(p,k,.1),mid(k,p,.12),4.3,3.0,far):'')+cap(k,ft,3.7,2.7,c)+(M.has('mollets')?mus(mid(k,ft,.12),mid(k,ft,.6),3.0,2.2,far):'')+`<ellipse class="${c}" cx="${ft[0]}" cy="${ft[1]}" rx="3.2" ry="2.3"/>`};
 let o=P.eq||'';
 o+=leg(hp2,k2,f2,!fr)+arm(sh2,e2,w2,!fr);
 const r1=fr?10.5:7.4,r2=fr?7.4:6;
 o+=cap(mid(P.s,P.h,.45),P.s,2.4,2.6,'b');
 o+=cap(P.s,P.p,r1,r2,'b');
 if(M.has('pecs')||M.has('dos'))o+=mus(mid(P.s,P.p,.06),mid(P.s,P.p,.5),r1*.78,(r1+r2)/2*.74,false);
 if(M.has('abdos')||M.has('lombaires'))o+=mus(mid(P.s,P.p,.52),mid(P.s,P.p,.9),(r1+r2)/2*.72,r2*.7,false);
 o+=`<circle cx="${P.h[0]}" cy="${P.h[1]}" r="7" class="hd"/><circle cx="${P.h[0]-1.8}" cy="${P.h[1]-2}" r="2.2" class="hl"/>`;
 o+=leg(hp1,P.k1,P.f1,false);
 o+=arm(sh1,P.e1,P.w1,false);
 if(M.has('epaules')){o+=`<circle cx="${sh1[0]}" cy="${sh1[1]}" r="4.4" class="m"/><circle cx="${sh1[0]-1}" cy="${sh1[1]-1.2}" r="1.6" class="mh"/>`;if(fr)o+=`<circle cx="${sh2[0]}" cy="${sh2[1]}" r="4.4" class="m"/><circle cx="${sh2[0]-1}" cy="${sh2[1]-1.2}" r="1.6" class="mh"/>`;}
 o+=P.eqf||'';
 return `<svg class="fig" viewBox="0 0 100 100" aria-hidden="true">${o}</svg>`;

/* ---------- Synchro iPhone ↔ iPad (base privée de l'artefact) ---------- */
let cfgRef=null,sessCol=null,syncSt='local',cfgTimer=null,cfgChain=Promise.resolve();const inflight=new Set();
function setSync(s){syncSt=s;document.querySelectorAll('[data-sync]').forEach(el=>el.outerHTML=syncChip())}
function syncChip(){const m={local:['','Sur cet appareil'],wait:['wait','Connexion…'],ok:['ok','Synchronisé'],off:['wait','Hors ligne'],err:['err','Erreur de synchro']}[syncSt];return `<span class="sync ${m[0]}" data-sync><i></i>${m[1]}</span>`}
async function initSync(){
 if(!window.claude||typeof claude.use!=='function')return;
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;const id=await user.id();if(!id)return;
  cfgRef=db.doc('data/users/'+id+'/jelift');sessCol=cfgRef.collection('sessions');
  setSync('wait');let tm=setTimeout(()=>{if(syncSt==='wait')setSync('off')},10000);
  let cfgFirst=true;
  cfgRef.onSnapshot(snap=>{
   const r=snap.exists?snap.data():null,live=!snap.metadata.fromCache;
   if(r&&(r.updatedAt||0)>(S.cfgAt||0)){S.programs=clone(r.programs||[]);S.custom=clone(r.custom||[]);if(r.lafay)S.lafay=clone(r.lafay);S.cfgAt=r.updatedAt;save();soft()}
   else if(live&&cfgFirst&&(!r||(S.cfgAt||0)>(r.updatedAt||0)))queuePushCfg(true);
   if(live){cfgFirst=false;clearTimeout(tm);if(syncSt!=='err')setSync('ok')}
  },()=>setSync('err'));
  sessCol.onSnapshot(snap=>{
   const live=!snap.metadata.fromCache,remote=new Map();
   snap.docs.forEach(d=>{if(d.exists)remote.set(d.id,d.data())});
   const del=new Set(S.deleted),pend=new Set(S.pending),out=[];
   remote.forEach((v,k)=>{if(!del.has(k))out.push(clone(v))});
   S.sessions.forEach(s=>{if(!remote.has(s.id)&&(pend.has(s.id)||!live))out.push(s)});
   if(live){
    S.pending=S.pending.filter(k=>!remote.has(k));S.pending.forEach(pushSess);
    S.deleted.forEach(k=>{if(inflight.has('d'+k))return;inflight.add('d'+k);sessCol.doc(k).delete().then(()=>{S.deleted=S.deleted.filter(x=>x!==k);save()}).catch(()=>{}).finally(()=>inflight.delete('d'+k))});
   }
   S.sessions=out.sort((a,b)=>b.start-a.start);save();soft();
  },()=>setSync('err'));
 }catch(e){setSync('local')}
}
function queuePushCfg(now){if(!cfgRef)return;clearTimeout(cfgTimer);cfgTimer=setTimeout(()=>{if(!S.cfgAt)S.cfgAt=1;const body=clone({programs:S.programs,custom:S.custom,lafay:S.lafay,updatedAt:S.cfgAt});cfgChain=cfgChain.then(()=>cfgRef.set(body)).then(()=>{if(syncSt!=='ok')setSync('ok')}).catch(e=>{setSync(e&&e.code==='quota_exceeded'?'err':'off')});save()},now?50:700)}
function pushSess(id){if(!sessCol||inflight.has(id))return;const s=S.sessions.find(x=>x.id===id);if(!s){S.pending=S.pending.filter(x=>x!==id);save();return}inflight.add(id);sessCol.doc(id).set(clone(s)).then(()=>{S.pending=S.pending.filter(x=>x!==id);save()}).catch(()=>{}).finally(()=>inflight.delete(id))}

function exCard(item,k){

 <div class="sets" style="--n:${t.cols.length}"><div class="srow h"><span>SÉRIE</span><span>PRÉCÉDENT</span>${t.lab.map(l=>`<span>${l}</span>`).join('')}<span>${ic('check').replace('<svg','<svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3"')}</span></div>
 ${item.sets.map((s,j)=>{const pv=last&&last.sets.filter(x=>x.done)[j];let n=0;item.sets.slice(0,j+1).forEach(x=>{if(!x.w)n++});
  return `<div class="srow ${s.done?'done':''} ${s.w?'w':''}"><button class="sn" data-a="setMenu" data-k="${k}" data-j="${j}">${s.w?'W':n}</button><span class="pv">${pv?setTxt(e.t,pv):'–'}</span>${t.cols.map(c=>inp(item,k,j,c,pv)).join('')}<button class="ck" data-a="check" data-k="${k}" data-j="${j}" aria-label="Valider la série">${ic('check')}</button></div>`}).join('')}
 </div><button class="btn addset" data-a="addSet" data-k="${k}">${ic('plus')}Ajouter une série</button></div>`;

function phOf(item,c,pv){const tv=c==='time'?item.target?.time:item.target?.[c];const v=pv&&pv[c]!=null?pv[c]:tv;return v==null?'':(c==='time'?fmtT(v):String(v))}
function inp(item,k,j,c,pv){const s=item.sets[j],v=s[c];const ph=phOf(item,c,pv);
 const im=c==='kg'?'decimal':'numeric';
 return `<input id="s${k}_${j}_${c}" inputmode="${im}" data-f="set" data-k="${k}" data-j="${j}" data-c="${c}" value="${v==null?'':(c==='time'?fmtT(v):v)}" placeholder="${esc(ph||(c==='kg'?'0':'–'))}" aria-label="${c}">`}

function entries(exId){const out=[];[...S.sessions].reverse().forEach(s=>{s.items.filter(i=>i.exId===exId).forEach(i=>{const ss=i.sets.filter(x=>x.done&&!x.w);if(ss.length)out.push({t:s.start,sid:s.id,sets:ss})})});return out}
const METRICS={
 weight:[['maxkg','Charge max',s=>Math.max(...s.map(x=>x.kg||0)),'kg'],['rm','1RM estimé',s=>Math.max(...s.map(x=>(x.kg||0)*(1+(x.reps||0)/30))),'kg'],['vol','Volume séance',s=>s.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0),'kg'],['reps','Reps max',s=>Math.max(...s.map(x=>x.reps||0)),'reps']],

function chart(pts,M){
 const W0=640,H0=280,L=58,R=18,T=18,B=40;
 const inv=!!M[4];let vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs);
 if(mn===mx){mn=mn-1-Math.abs(mn)*.1;mx=mx+1+Math.abs(mx)*.1}
 const span=mx-mn,step=nice(span/4);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
 const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;
 const X=t=>pts.length===1?L+(W0-L-R)/2:L+(t-t0)/(t1-t0||1)*(W0-L-R);
 const Y=v=>inv?T+(v-mn)/(mx-mn)*(H0-T-B):H0-B-(v-mn)/(mx-mn)*(H0-T-B);
 let g='';for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line class="gl" x1="${L}" x2="${W0-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+5}" text-anchor="end">${M[3]==='s'?fmtT(v):fmtN(v)}</text>`}
 const nT=Math.min(5,pts.length);for(let i=0;i<nT;i++){const p=pts[Math.round(i*(pts.length-1)/Math.max(1,nT-1))];const an=pts.length>1&&p===pts[0]?'start':pts.length>1&&p===pts[pts.length-1]?'end':'middle';g+=`<text x="${X(p.t)}" y="${H0-12}" text-anchor="${an}">${DSHORT.format(p.t).replace('.','')}</text>`}
 const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
 const bestV=inv?Math.min(...vs):Math.max(...vs);
 const area=pts.length>1?`<path class="ar" d="${d} L${X(t1)} ${H0-B} L${X(t0)} ${H0-B}Z"/>`:'';
 return `<svg class="chart" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="${M[1]}">${g}${area}<path class="ln" d="${d}"/>${pts.map(p=>`<circle class="pt ${p.v===bestV?'best':''}" cx="${X(p.t)}" cy="${Y(p.v)}" r="${p.v===bestV?7:5}"><title>${DSHORT.format(p.t)} : ${fmtM(p.v,M[3])}</title></circle>`).join('')}</svg>`;
}
function nice(x){const e=Math.pow(10,Math.floor(Math.log10(x||1))),f=x/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

/* ===================== Méthode Lafay : logique ===================== */
const LN=c=>ex('L'+c).n.replace(/^[A-Z]\d* · /,'');
/* Dernière perf d'un exercice : séries (hors échauffement) de l'occurrence la plus fournie dans la séance la plus récente */
function lafPerf(code){const id='L'+code;for(const s of S.sessions){const its=s.items.filter(i=>i.exId===id);if(!its.length)continue;let best=null,bt=-1;its.forEach(i=>{const w=i.sets.filter(x=>!x.w&&x.done!==false);const t=w.reduce((a,x)=>a+(x.reps||x.time||0),0);if(t>bt){bt=t;best=w}});if(best&&best.length)return {sets:best,t:s.start}}return null}
const perfTxt=p=>p?p.sets.map(x=>x.reps!=null?x.reps:x.time!=null?fmtT(x.time):'–').join(' · '):'';
const weeksAt=()=>Math.floor((Date.now()-(S.lafay.since||Date.now()))/(7*864e5));
const sessAt=n=>S.sessions.filter(s=>s.lafLvl===n&&s.start>=(n===S.lafay.lvl?S.lafay.since:0)).length;
function lafCur(x){if(!x.ch)return x.e;const ch=LCH[x.ch],v=S.lafay.v[x.ch];let i=Math.max(0,ch.indexOf(v));if(x.min)i=Math.max(i,ch.indexOf(x.min));if(ch.indexOf(x.e)>i)i=ch.indexOf(x.e);return ch[i]}
function lafNextVar(x){if(!x.ch||!x.up)return null;const ch=LCH[x.ch],cur=lafCur(x),i=ch.indexOf(cur);if(i<0||i>=ch.length-1)return null;const p=lafPerf(cur);if(!p)return null;const ok=p.sets.filter(s=>(s.reps||0)>=x.up.r).length>=x.up.n;return ok?{from:cur,to:ch[i+1],p}:null}
const PALS=[8,12,15,20,25,30];
function lafCap(code){if(S.lafay.cap[code])return S.lafay.cap[code];const p=lafPerf(code);if(!p)return 8;const f=p.sets.slice(0,4),a=f.reduce((s,x)=>s+(x.reps||0),0)/Math.max(1,f.length);return a>13?20:a>=11?15:a>=8?12:8}
function lafCapUp(code){const c=lafCap(code),p=lafPerf(code);if(!p||c>=30)return null;const ok=p.sets.length>=6&&p.sets.slice(0,6).every(s=>(s.reps||0)>=c);return ok?PALS[PALS.indexOf(c)+1]||null:null}
function lafAuto(code){const p=lafPerf(code);if(!p)return 5;const m=Math.max(...p.sets.map(s=>s.reps||0));return m>=23?8:m>=18?7:5}
function lafCrit(n){const L=LAF[n-1];return (L.pass||[]).map((c,i)=>{let ok=false,info='';
 if(c.k==='sets'||c.k==='one'){const p=lafPerf(c.e);if(p){info='Dernière fois : '+perfTxt(p);ok=c.k==='one'?Math.max(...p.sets.map(s=>s.reps||0))>=c.r:p.sets.filter(s=>(s.reps||0)>=c.r).length>=c.n}else info='Pas encore fait'}
 else if(c.k==='weeks'){const w=n===S.lafay.lvl?weeksAt():0;ok=w>=c.w;info=`${w} semaine${w>1?'s':''} sur ${c.w}`}
 const man=!!S.lafay.chk[n+':'+i];
 const t=c.t||(c.k==='sets'?`${c.e} : ${c.n} × ${c.r}`:c.k==='one'?`${c.e} : ${c.r} répétitions`:'');
 return {i,t,ok:ok||man,auto:ok,man,info,k:c.k}})}
function lafNext(n){const L=LAF[n-1];if(n===1)return S.lafay.n1||'test';if(L.sess.length<2)return L.sess[0].k;const last=S.sessions.find(s=>s.lafLvl===n&&s.lafSess);if(!last)return L.sess[0].k;const i=L.sess.findIndex(s=>s.k===last.lafSess);return L.sess[(i+1)%L.sess.length].k}
function lafItemTxt(x,code){const s=x.side?`${x.s} série${x.s>1?'s':''} par côté`:null;let r;

function rng(seed){let x=(seed>>>0)||1;return()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return (x%100000)/100000}}
function shuffle(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pplNext(){for(const s of S.sessions){const q=s.qf||(/\bpush\b/i.test(s.name)?'push':/\bpull\b/i.test(s.name)?'pull':/\blegs?\b/i.test(s.name)?'legs':null);if(['push','pull','legs'].includes(q))return {push:'pull',pull:'legs',legs:'push'}[q]}return 'push'}
function qTarget(e,role,eqk,d,ab){
 if(e.t==='time')return {time:ab?(d<=15?30:45):(d<=15?30:40)};
 if(e.t==='dist')return {dist:e.id==='run'?(d<=15?400:800):e.id==='bbj'?20:500};

function qWork(e,t){if(t.time)return t.time+10;if(e.t==='dist')return e.id==='run'?t.dist*.33:['rowerg','ski'].includes(e.id)?t.dist*.25:50;if(e.t==='distw')return 60;return (t.reps||10)*3+10}
function genQuick(d,f,eqk,seed){
 const eq=EQP[eqk].eq,r=rng(seed*7919+d*31+f.length*131+eqk.length*17),focus=f==='ppl'?pplNext():f,def=QF[focus],P=QPAR[d];
 const ab=focus==='abdo',hy=focus==='hyrox',rest=ab?(d<=15?20:30):hy?(d<=30?30:45):P.rest;
 const pri=id=>eqk==='none'||(REQ[id]||[]).length?0:1;/* avec du matériel, les exercices qui l'utilisent passent en premier */
 const cache={},pool=(p,role)=>cache[p+role]||(cache[p+role]=shuffle(QP[p][role].filter(id=>hasEq(id,eq)),r).sort((a,b)=>pri(a)-pri(b)));
 const used=new Set(),usedPose=new Set(),items=[],budget=d*60;let total=P.warm;
 for(let k=0;k<16&&total<budget*.9;k++){const [p,role]=def.mix[k%def.mix.length];
  let l=pool(p,role).filter(x=>!used.has(x));if(!l.length)l=pool(p,role==='c'?'i':'c').filter(x=>!used.has(x));if(!l.length)continue;
  const id=l.find(x=>!usedPose.has(ex(x).pose))||l[0];used.add(id);usedPose.add(ex(id).pose);const e=ex(id),t=qTarget(e,role,eqk,d,ab),sets=(ab||hy)?P.sets:role==='c'?P.sets:Math.max(3,P.sets-1);
  const blk=sets*(qWork(e,t)+rest);if(total+blk>budget*1.08&&items.length>=3)continue;
  items.push({id,sets,rest,...t});total+=blk}
 let g=0;while(total<budget*.85&&items.length&&g<24){const x=items[g%items.length];x.sets++;total+=qWork(ex(x.id),x)+x.rest;g++}
 return {focus,name:def.n,items,est:Math.round(total/60),cat:ab?'abdo':hy?'hyrox':'split'}}

/* ===================== Compte (unique, sur cet appareil) ===================== */
const ACC={get:()=>LS.get('jefit.account',null),set:a=>LS.set('jefit.account',a),logged:()=>!!LS.get('jefit.logged',false)&&!!LS.get('jefit.account',null)};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt,algo){
 if(algo!=='f'&&window.crypto&&crypto.subtle){const enc=new TextEncoder();const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
 let h1=0x811c9dc5,h2=0x1b873593,s=salt+'|'+pw;for(let r=0;r<2000;r++)for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822507)^(h1>>>13)}
 return (h1>>>0).toString(16)+(h2>>>0).toString(16);
}
const pwAlgo=()=>window.crypto&&crypto.subtle?'p':'f';

/* ===================== Supabase (sauvegarde en ligne) ===================== */
/* Option : collez ici l'URL et la clé « anon public » de votre projet Supabase pour ne pas avoir à les saisir dans Paramètres. */
const SB_DEF={url:'',key:''};
var sbSt='off',sbMsg='',sbTimer=null,sbBusy=false,sbAgain=false,sbLast=LS.get('jefit.sbLast',0);
function sbCfg(){const c=LS.get('jefit.sb',{})||{};return {url:String(c.url||SB_DEF.url||'').trim().replace(/\/+$/,''),key:String(c.key||SB_DEF.key||'').trim()}}
const sbOn=()=>{const c=sbCfg();return !!(c.url&&c.key)};
const sbLinked=()=>!!LS.get('jefit.sbs',null);
const slug=n=>String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'')||'user';
const sbEmail=n=>slug(n)+'@jefit.app';
function sbStore(j){LS.set('jefit.sbs',{access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id})}
async function sbFetch(path,opt={},auth=true){
 const c=sbCfg();const h={apikey:c.key,'Content-Type':'application/json',...(opt.headers||{})};
 if(auth){const t=await sbToken();if(!t){const e=new Error('Non connecté');e.code='nolink';throw e}h.Authorization='Bearer '+t}
 const r=await fetch(c.url+path,{...opt,headers:h});const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
 if(!r.ok){const e=new Error((j&&(j.msg||j.error_description||j.message||j.error))||('Erreur '+r.status));e.status=r.status;e.code=j&&(j.code||j.error_code);throw e}
 return j;
}
async function sbToken(){
 const s=LS.get('jefit.sbs',null);if(!s)return null;if(Date.now()<s.exp-60000)return s.access;
 try{const j=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh})},false);sbStore(j);return j.access_token}
 catch(e){if(e.status===400||e.status===401)LS.del('jefit.sbs');return null}
}
async function sbLogin(name,pw){const j=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:sbEmail(name),password:pw})},false);sbStore(j)}
async function sbSignup(name,pw){
 const j=await sbFetch('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:sbEmail(name),password:pw,data:{name}})},false);
 if(j&&j.access_token){sbStore(j);return}
 if(j&&j.session&&j.session.access_token){sbStore(j.session);return}
 const e=new Error('Dans Supabase, désactivez « Confirm email » (Authentication › Sign In / Providers › Email).');e.code='confirm';throw e;
}
const sbTaken=e=>/already|registered|exists/i.test(e&&e.message||'')||(e&&e.code==='user_already_exists');
/* Connexion au compte en ligne ; le crée s'il n'existe pas encore */
async function sbConnect(name,pw){try{await sbLogin(name,pw)}catch(e){if(e.status!==400)throw e;try{await sbSignup(name,pw)}catch(e2){if(sbTaken(e2)){const x=new Error('Mot de passe incorrect pour ce compte en ligne.');x.code='badpw';throw x}throw e2}}}
function sbSnap(){const a=ACC.get()||{};return clone({app:'JeFIT',v:1,name:a.name,programs:S.programs,custom:S.custom,lafay:S.lafay,sessions:S.sessions,tomb:S.tomb,cfgAt:S.cfgAt,bw:LS.get('jelift.bw',80),at:Date.now()})}
function sbMerge(r){
 if(!r||r.app!=='JeFIT')return false;let ch=false;
 const tomb=new Set([...(S.tomb||[]),...(r.tomb||[])]);if(tomb.size!==S.tomb.length){S.tomb=[...tomb];ch=true}
 if((r.cfgAt||0)>(S.cfgAt||0)){S.programs=clone(r.programs||S.programs);S.custom=clone(r.custom||[]);if(r.lafay)S.lafay=clone(r.lafay);S.cfgAt=r.cfgAt;ch=true;if(typeof queuePushCfg==='function')queuePushCfg()}
 const have=new Set(S.sessions.map(s=>s.id));(r.sessions||[]).forEach(s=>{if(!have.has(s.id)&&!tomb.has(s.id)){S.sessions.push(clone(s));S.pending.push(s.id);ch=true}});
 const n=S.sessions.length;S.sessions=S.sessions.filter(s=>!tomb.has(s.id));if(S.sessions.length!==n)ch=true;
 if(ch){S.sessions.sort((a,b)=>b.start-a.start);LS.set(KEY,S);S.pending.forEach(pushSess)}
 return ch;
}
function setSb(st,msg=''){sbSt=st;sbMsg=msg;document.querySelectorAll('[data-sbchip]').forEach(el=>el.outerHTML=sbChip());const m=$('#sbmsg');if(m)m.textContent=sbMsg}
function sbChip(){const m={off:['','Non configurée'],nolink:['wait','Non connectée'],wait:['wait','Synchro…'],ok:['ok','À jour'],err:['err','Erreur']}[sbSt]||['',''];return `<span class="sync ${m[0]}" data-sbchip><i></i>${m[1]}</span>`}
function sbQueue(){if(!sbOn()||!sbLinked()||!ACC.logged())return;clearTimeout(sbTimer);sbTimer=setTimeout(()=>sbSync(),2500)}
async function sbSync(loud){
 if(!sbOn()){setSb('off');return}
 if(!sbLinked()){setSb('nolink');return}
 if(sbBusy){sbAgain=true;return}
 sbBusy=true;setSb('wait');
 try{
  const rows=await sbFetch('/rest/v1/jefit_data?select=data',{method:'GET'});
  const changed=sbMerge(rows&&rows[0]&&rows[0].data);
  const uid=(LS.get('jefit.sbs',{})||{}).uid;
  await sbFetch('/rest/v1/jefit_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:uid,data:sbSnap(),updated_at:new Date().toISOString()})});
  sbLast=Date.now();LS.set('jefit.sbLast',sbLast);
  setSb('ok','Dernière sauvegarde : '+HOUR.format(sbLast));if(loud)toast('Sauvegardé en ligne');
  if(changed)soft();
 }catch(e){
  const tbl=e.code==='42P01'||e.code==='PGRST205'||e.status===404;
  setSb(e.code==='nolink'?'nolink':'err',tbl?'Table « jefit_data » introuvable : lancez le script SQL ci-dessous dans Supabase.':(e.message==='Failed to fetch'?'Hors ligne ou URL incorrecte.':e.message));
  if(loud)toast('Synchro impossible');
 }finally{sbBusy=false;if(sbAgain){sbAgain=false;sbQueue()}}
}
const SB_SQL=`create table if not exists public.jefit_data (
  user_id uuid primary key default auth.uid() references auth.users on delete cascade,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.jefit_data enable row level security;
create policy "jefit lire"     on public.jefit_data for select using (auth.uid() = user_id);
create policy "jefit ajouter"  on public.jefit_data for insert with check (auth.uid() = user_id);
create policy "jefit modifier" on public.jefit_data for update using (auth.uid() = user_id);`;

let authMode='create';
function authHTML(){
 const a=ACC.get(),on=sbOn();
 let body='';
 if(authMode==='login'&&a)body=`<h2>Bon retour, ${esc(a.name)} !</h2><p class="lead">Entrez votre mot de passe.</p>
  <div class="form"><label>Mot de passe<input id="ap1" type="password" autocomplete="current-password"></label></div>
  <div class="err" id="aerr"></div><button class="btn pri blk" data-a="authGo">Entrer</button>
  <button class="lnk" data-a="authMode" data-v="forgot">Mot de passe oublié ?</button>`;
 else if(authMode==='forgot')body=`<h2>Mot de passe oublié</h2><p class="lead">Le compte de cet appareil sera remplacé par un nouveau. Vos programmes et séances restent dans ce navigateur.</p>
  <div class="err" id="aerr"></div><button class="btn pri blk" data-a="authReset" style="background:var(--danger);color:#fff">Créer un nouveau compte</button>
  <button class="lnk" data-a="authMode" data-v="login">Retour</button>`;
 else if(authMode==='restore')body=`<h2>Retrouver mon compte</h2><p class="lead">Connectez-vous à votre compte en ligne pour récupérer vos séances.</p>
  <div class="form"><label>Nom<input id="an" autocomplete="username" autocapitalize="words"></label><label>Mot de passe<input id="ap1" type="password" autocomplete="current-password"></label></div>
  <div class="err" id="aerr"></div><button class="btn pri blk" data-a="authGo">Se connecter</button>
  <button class="lnk" data-a="authMode" data-v="create">Créer un compte à la place</button>`;
 else body=`<h2>Créer mon compte</h2><p class="lead">Un compte unique pour enregistrer vos entraînements.</p>
  <div class="form"><label>Nom<input id="an" autocomplete="username" autocapitalize="words" maxlength="30"></label><label>Mot de passe (6 caractères min.)<input id="ap1" type="password" autocomplete="new-password"></label><label>Confirmer le mot de passe<input id="ap2" type="password" autocomplete="new-password"></label></div>
  <div class="err" id="aerr"></div><button class="btn pri blk" data-a="authGo">Créer mon compte</button>
  ${on?`<button class="lnk" data-a="authMode" data-v="restore">J’ai déjà un compte en ligne</button>`:''}
  <p class="note">${on?'Vos séances sont gardées dans ce navigateur et sauvegardées en ligne.':'Vos séances sont gardées dans ce navigateur : pas besoin de les retaper.'}</p>`;
 return `<div class="ac">${WM()}${body}</div>`;
}
function showAuth(){authMode=ACC.get()?'login':'create';let d=$('#auth');if(!d){d=document.createElement('div');d.id='auth';document.body.appendChild(d);d.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=d.querySelector('[data-a="authGo"],[data-a="authReset"]');if(b){e.preventDefault();b.click()}}})}d.innerHTML=authHTML();if(!$('#splash'))d.classList.add('in');closeSheet();authFocus()}
function authFocus(){if($('#splash'))return;const i=document.querySelector('#auth input');if(i)i.focus()}
function hideAuth(){const d=$('#auth');if(d)d.remove()}
const aErr=t=>{const e=$('#aerr');if(e)e.textContent=t};
async function makeAccount(name,pw){const salt=uid()+uid(),algo=pwAlgo();ACC.set({name,salt,algo,hash:await hashPw(pw,salt,algo),created:Date.now()});LS.set('jefit.logged',true)}
async function authGo(btn){
 const v=id=>{const e=$('#'+id);return e?e.value:''};
 btn.disabled=true;aErr('');
 try{
  if(authMode==='login'){
   const a=ACC.get(),pw=v('ap1');
   if((await hashPw(pw,a.salt,a.algo))!==a.hash){aErr('Mot de passe incorrect.');return}
   LS.set('jefit.logged',true);
   if(sbOn()&&!sbLinked())try{await sbConnect(a.name,pw)}catch(e){}
  }else if(authMode==='restore'){
   const name=v('an').trim(),pw=v('ap1');if(!name||!pw){aErr('Nom et mot de passe requis.');return}
   try{await sbLogin(name,pw)}catch(e){aErr(e.status===400?'Nom ou mot de passe incorrect.':'Connexion impossible : '+e.message);return}
   await makeAccount(name,pw);
  }else{
   const name=v('an').trim().replace(/\s+/g,' '),p1=v('ap1'),p2=v('ap2');
   if(name.length<2){aErr('Choisissez un nom (2 caractères min.).');return}
   if(p1.length<6){aErr('Le mot de passe doit faire au moins 6 caractères.');return}
   if(p1!==p2){aErr('Les deux mots de passe sont différents.');return}
   let note='';
   if(sbOn()){try{await sbSignup(name,p1)}catch(e){if(sbTaken(e)){aErr('Ce nom est déjà pris : choisissez-en un autre ou « J’ai déjà un compte en ligne ».');return}note=e.code==='confirm'?e.message:'Sauvegarde en ligne indisponible pour l’instant : vous pourrez la connecter dans Paramètres.'}}
   await makeAccount(name,p1);
   if(note)setTimeout(()=>toast(note),2400);
  }
  hideAuth();render();toast('Bienvenue '+ACC.get().name+' !');sbSync();
 }finally{btn.disabled=false}
}
Object.assign(A,{
 authGo:el=>authGo(el),
 authMode:el=>{authMode=el.dataset.v;$('#auth').innerHTML=authHTML();authFocus()},
 authReset:()=>{LS.del('jefit.account');LS.del('jefit.logged');LS.del('jefit.sbs');authMode='create';$('#auth').innerHTML=authHTML();authFocus()},
 logout:()=>confirmSheet('Se déconnecter ?','Vos données restent sur cet appareil. Il faudra votre mot de passe pour revenir.','Se déconnecter',()=>{LS.del('jefit.logged');showAuth()}),
 accPw:()=>openSheet(`<h2>Changer le mot de passe</h2><div class="form"><label>Mot de passe actuel<input id="pw0" type="password" autocomplete="current-password"></label><label>Nouveau mot de passe (6 caractères min.)<input id="pw1" type="password" autocomplete="new-password"></label><label>Confirmer<input id="pw2" type="password" autocomplete="new-password"></label></div><div id="pwerr" style="color:var(--danger);font-size:14px;min-height:20px"></div>`,`<button class="btn" data-a="close">Annuler</button><button class="btn pri" data-a="accPwOk">Enregistrer</button>`),
 accPwOk:async()=>{const a=ACC.get(),e=t=>$('#pwerr').textContent=t,p0=$('#pw0').value,p1=$('#pw1').value;
  if((await hashPw(p0,a.salt,a.algo))!==a.hash)return e('Mot de passe actuel incorrect.');
  if(p1.length<6)return e('6 caractères minimum.');if(p1!==$('#pw2').value)return e('Les deux mots de passe sont différents.');
  if(sbLinked()){try{await sbFetch('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:p1})})}catch(x){return e('Impossible de changer le mot de passe en ligne : '+x.message)}}
  a.salt=uid()+uid();a.algo=pwAlgo();a.hash=await hashPw(p1,a.salt,a.algo);ACC.set(a);closeSheet();toast('Mot de passe changé')},
 sbSave:()=>{const url=$('#sbu').value.trim(),key=$('#sbk').value.trim();if(url&&!/^https:\/\/.+/.test(url)){toast('L’URL doit commencer par https://');return}LS.set('jefit.sb',{url,key});LS.del('jefit.sbs');setSb(url&&key?'nolink':'off');toast('Configuration enregistrée');render()},
 sbLink:()=>openSheet(`<h2>Connecter Supabase</h2><p class="mut" style="margin:0">Confirmez le mot de passe de <b>${esc(ACC.get().name)}</b>. Le compte en ligne est créé s’il n’existe pas.</p><div class="form"><label>Mot de passe<input id="sbp" type="password" autocomplete="current-password"></label></div><div id="sberr" style="color:var(--danger);font-size:14px;min-height:20px"></div>`,`<button class="btn" data-a="close">Annuler</button><button class="btn pri" data-a="sbLinkOk">Connecter</button>`),
 sbLinkOk:async el=>{const a=ACC.get(),pw=$('#sbp').value,e=t=>$('#sberr').textContent=t;
  if((await hashPw(pw,a.salt,a.algo))!==a.hash)return e('Mot de passe incorrect.');
  el.disabled=true;try{await sbConnect(a.name,pw);closeSheet();await sbSync(true);render()}catch(x){e(x.message==='Failed to fetch'?'Connexion impossible : vérifiez l’URL et votre réseau.':x.message)}finally{el.disabled=false}},
 sbNow:()=>sbSync(true),
 sbUnlink:()=>confirmSheet('Déconnecter Supabase ?','Les données restent sur cet appareil et dans Supabase ; la synchro s’arrête.','Déconnecter',()=>{LS.del('jefit.sbs');setSb('nolink');render()}),
 replayIntro:()=>splash(),
});

/* ===================== Intro : le logo apparaît lettre par lettre ===================== */
function splash(){
 if($('#splash'))return;
 const tx=(x,len,s)=>`<text x="${x}" y="40" font-family="Rubik,system-ui,sans-serif" font-weight="900" font-size="41" textLength="${len}" lengthAdjust="spacingAndGlyphs">${s}</text>`;
 const LN=[[-12,14,16],[-18,22,20],[-10,30,12]];
 const lines=c=>LN.map(([x,y,w],i)=>`<rect ${c?`class="sl" style="--d:${.05+i*.09}s"`:''} x="${x}" y="${y}" width="${w}" height="4.5" rx="2.2"/>`).join('');
 const DB='<rect x="97" y="9" width="19" height="7.5" rx="2.6"/><rect x="100.5" y="17.2" width="12" height="3" rx="1.2"/><rect x="104" y="19.5" width="5" height="11" rx="1.6"/><rect x="100.5" y="29.8" width="12" height="3" rx="1.2"/><rect x="97" y="33.5" width="19" height="7.5" rx="2.6"/>';
 const JEF=tx(10,82,'JEF'),T=tx(120,28,'T');
 const CL=[[3,34],[37,27.5],[64.5,32],[116,38]];
 const lt=(i,t,del)=>`<g clip-path="url(#spc${i})"><g class="lt" style="--d:${del}s">${t}</g></g>`;
 const svg=`<svg viewBox="0 0 162 48" role="img" aria-label="JeFIT"><defs>${CL.map(([x,w],i)=>`<clipPath id="spc${i}"><rect x="${x}" y="-14" width="${w}" height="58"/></clipPath>`).join('')}
  <linearGradient id="spSh" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="-40" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <g transform="translate(18 0) skewX(-12)"><g fill="url(#jlg)">${lines(1)}${lt(0,JEF,.3)}${lt(1,JEF,.42)}${lt(2,JEF,.54)}<g class="db">${DB}</g>${lt(3,T,.82)}</g>
  <g fill="url(#spSh)">${lines(0)}${JEF}${DB}${T}</g></g></svg>`;
 const d=document.createElement('div');d.id='splash';
 d.innerHTML=`<div class="spw">${svg}<div class="spu"></div><div class="sp-tag">Prêt à transpirer ?</div></div><div class="sp-skip">Touchez pour passer</div>`;
 document.body.appendChild(d);
 let done=false;const timers=[];
 const end=()=>{if(done)return;done=true;timers.forEach(clearTimeout);d.classList.add('out');const a=$('#auth');if(a)setTimeout(()=>a.classList.add('in'),150);setTimeout(()=>{d.remove();authFocus()},600)};
 d.addEventListener('click',end);
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const sheen=()=>{const g=d.querySelector('#spSh');if(!g)return;const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/800),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,x=-90+e*290;g.setAttribute('x1',x);g.setAttribute('x2',x+50);if(k<1&&!done)requestAnimationFrame(f)};requestAnimationFrame(f)};
 const start=()=>{if(done)return;d.classList.add('go');if(reduce){timers.push(setTimeout(end,1400));return}timers.push(setTimeout(sheen,1450),setTimeout(end,3000))};
 if(reduce)d.querySelectorAll('.sl,.lt,.db').forEach(e=>{e.style.animationDuration='1ms';e.style.animationDelay='0s'});
 const fr=document.fonts&&document.fonts.load?document.fonts.load('900 41px Rubik'):Promise.resolve();
 Promise.race([fr,new Promise(r=>setTimeout(r,700))]).then(start,start);
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('pointerdown',audio,{once:true});
$('#ov').addEventListener('click',closeSheet);
let inputT=null;
document.addEventListener('input',e=>{const el=e.target,f=el.dataset.f;if(!f)return;
 if(f==='set'){const item=W.items[+el.dataset.k],s=item.sets[+el.dataset.j],c=el.dataset.c;s[c]=c==='time'?digitsToSec(el.value):num(el.value);if(c==='time'&&el.value.replace(/\D/g,'').length>=3){el.value=fmtT(s[c])}clearTimeout(inputT);inputT=setTimeout(saveW,300);updWkStats()}
 else if(f==='wkname'){W.name=el.value;clearTimeout(inputT);inputT=setTimeout(saveW,300)}
 else if(f==='wnote'){W.items[+el.dataset.k].note=el.value;clearTimeout(inputT);inputT=setTimeout(saveW,300)}
 else if(f==='pkq'){PK.q=el.value;refreshPicker()}
 else if(f==='pq'){view.q=el.value;const pos=el.selectionStart;render();const n=$('#pq');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('change',e=>{const el=e.target,f=el.dataset.f;if(!f)return;
 if(f==='bw'){const v=num(el.value);if(v>20&&v<300){LS.set('jelift.bw',v);toast('Poids enregistré')}return}
 if(f==='dayname'){const d=curDay();d.name=el.value.trim()||d.name;touchCfg()}
 else if(f==='it'){const d=curDay(),i=d.items[+el.dataset.k],c=el.dataset.c;i[c]=c==='note'?el.value:c==='time'?digitsToSec(el.value):num(el.value);if(c==='rest')i.rest=+el.value||0;if(c==='time')el.value=fmtT(i.time);touchCfg()}
 else if(f==='set'&&el.dataset.c==='time'){const s=W.items[+el.dataset.k].sets[+el.dataset.j];el.value=s.time==null?'':fmtT(s.time)}
});
applyTheme();render();if(W)wake();initSync();
splash();
if(!ACC.logged())showAuth();else sbSync();
if(!sbOn())setSb('off');else if(!sbLinked())setSb('nolink');
</script>
</body></html>
